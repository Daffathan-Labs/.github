# CI untuk service Python (Flask / FastAPI).
# ruff cuma nangkep error yang pasti bug (syntax, nama gak terdefinisi), bukan gaya,
# biar kode lama gak langsung merah.
name: ci-python

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.11'
      test-path:
        type: string
        default: tests
      env:
        description: Baris KEY=VALUE tambahan (nilai dummy buat test, BUKAN secret asli).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Lint & pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Env tambahan
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: 📦 Install
        run: |
          pip install -r requirements.txt
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; else pip install pytest; fi

      - name: 🧹 Ruff (error saja)
        run: pipx run ruff==0.14.0 check --select E9,F63,F7,F82 --exclude venv,.venv .

      - name: 🧪 Pytest
        run: |
          if [ -d "${{ inputs.test-path }}" ]; then python -m pytest "${{ inputs.test-path }}" -q
          else echo "Belum ada folder ${{ inputs.test-path }}, test dilewati."; fi
