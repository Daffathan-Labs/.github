name: ci-flutter

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: if [ -d test ]; then flutter test; else echo "Belum ada folder test/, dilewati."; fi
